<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon. Le SVG couvre tous les navigateurs modernes ; les deux PNG
         sont là pour les contextes qui ne savent pas lire un favicon
         vectoriel (anciens Safari, agrégateurs, aperçus de liens). Tous
         sortent du même dessin — voir scripts/build-brand.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />

    <!-- Viewport safe area (notch Android + home bar iOS) -->
    <!-- maximum-scale=1 + user-scalable=no kill the iOS focus auto-zoom
         on inputs (native-app feel). Inputs are also ≥16px as a belt-and-
         suspenders so Safari never zooms in on focus. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Preconnect to the runtime endpoints we hit on every paint so the
         DNS + TLS handshake lands in parallel with the index chunk
         download. Saves ~150 ms on first auth / first map tile / first
         tap on a real-world 4G connection. -->
    <link rel="preconnect" href="https://gdrdspfktnweqozrezjq.supabase.co" crossorigin />
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="preconnect" href="https://events.mapbox.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.supabase.com" />

    <!-- Standard PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#E8203A" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="REVS" />
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="/icons/icon-167x167.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/icons/icon-152x152.png"
    />

    <!-- Splash screen iOS (iPhone 14 / 13 / 12 — 390x844 @3x) -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
      href="/splashscreens/iphone14.png"
    />

    <title>REVS — Cars. Spots. Passion.</title>
    <meta
      name="description"
      content="REVS — repère, photographie et collectionne les voitures que tu croises. Cars. Spots. Passion."
    />

    <!-- Partage social. L'URL de og:image DOIT être absolue : Facebook,
         WhatsApp, iMessage et Discord ne résolvent pas les chemins relatifs.
         Le domaine est celui de la production Vercel — à changer ici en même
         temps qu'un éventuel nom de domaine propre. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="REVS" />
    <meta property="og:title" content="REVS — Cars. Spots. Passion." />
    <meta
      property="og:description"
      content="Repère, photographie et collectionne les voitures que tu croises."
    />
    <meta property="og:url" content="https://revs-ten.vercel.app/" />
    <meta
      property="og:image"
      content="https://revs-ten.vercel.app/brand/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo REVS — Cars. Spots. Passion." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="REVS — Cars. Spots. Passion." />
    <meta
      name="twitter:description"
      content="Repère, photographie et collectionne les voitures que tu croises."
    />
    <meta
      name="twitter:image"
      content="https://revs-ten.vercel.app/brand/og-image.jpg"
    />

    <!-- Self-heal: if a hashed asset 404s (stale service worker serving an
         old index.html after a deploy), unregister the SW, clear caches and
         reload once so the app can never get permanently bricked. -->
    <script>
      (function () {
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target
            if (
              !t ||
              t.tagName !== 'SCRIPT' ||
              !t.src ||
              t.src.indexOf('/assets/') === -1
            )
              return
            if (sessionStorage.getItem('revs_recovered')) return
            sessionStorage.setItem('revs_recovered', '1')
            Promise.resolve()
              .then(function () {
                if ('serviceWorker' in navigator)
                  return navigator.serviceWorker
                    .getRegistrations()
                    .then(function (rs) {
                      return Promise.all(
                        rs.map(function (r) {
                          return r.unregister()
                        }),
                      )
                    })
              })
              .then(function () {
                if (window.caches)
                  return caches.keys().then(function (ks) {
                    return Promise.all(
                      ks.map(function (k) {
                        return caches.delete(k)
                      }),
                    )
                  })
              })
              .then(function () {
                location.reload()
              })
              .catch(function () {
                location.reload()
              })
          },
          true,
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
