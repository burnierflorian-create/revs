<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Viewport safe area (notch Android + home bar iOS) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Standard PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#E63946" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="revs" />
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="/icons/icon-167x167.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/icons/icon-152x152.png"
    />

    <!-- Splash screen iOS (iPhone 14 / 13 / 12 — 390x844 @3x) -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
      href="/splashscreens/iphone14.png"
    />

    <title>revs</title>

    <!-- Self-heal: if a hashed asset 404s (stale service worker serving an
         old index.html after a deploy), unregister the SW, clear caches and
         reload once so the app can never get permanently bricked. -->
    <script>
      (function () {
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target
            if (
              !t ||
              t.tagName !== 'SCRIPT' ||
              !t.src ||
              t.src.indexOf('/assets/') === -1
            )
              return
            if (sessionStorage.getItem('revs_recovered')) return
            sessionStorage.setItem('revs_recovered', '1')
            Promise.resolve()
              .then(function () {
                if ('serviceWorker' in navigator)
                  return navigator.serviceWorker
                    .getRegistrations()
                    .then(function (rs) {
                      return Promise.all(
                        rs.map(function (r) {
                          return r.unregister()
                        }),
                      )
                    })
              })
              .then(function () {
                if (window.caches)
                  return caches.keys().then(function (ks) {
                    return Promise.all(
                      ks.map(function (k) {
                        return caches.delete(k)
                      }),
                    )
                  })
              })
              .then(function () {
                location.reload()
              })
              .catch(function () {
                location.reload()
              })
          },
          true,
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
